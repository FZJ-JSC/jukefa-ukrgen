# gemm_fma_bc: FMA for the main loop; mul, add and fma for the epilogue's cases; scalars broadcast from memory (bc_load); C across vectors by strided loads and stores
description: FMA for the main loop; mul, add and fma for the epilogue's cases; scalars broadcast from memory (bc_load); C across vectors by strided loads and stores
ukr: gemm
variants:
  m:
    K: i=m, n=1, k*=1
    T: i=m, n=1
    V: A
    S: B
  n:
    K: m=1, i=n, k*=1
    T: m=1, i=n
    V: B
    S: A
alternatives:
  CL:
  - direct
  - strided
  CS:
  - direct
  - strided
tileops:
  mm: fma($V.VEC:direct, $S.VEC:bc_load, AB.VEC){$K}
  betascale: mul(C.VEC:$CL, beta.VEC:bc_load, C.VEC){$T}
  alphascale: fma(AB.VEC, alpha.VEC:bc_load, C.VEC){$T}
  store: C.VEC:$CS
  alphamul: mul(AB.VEC, alpha.VEC:bc_load, C.VEC){$T}
  add: add(AB.VEC, C.VEC:$CL, C.VEC){$T}
  alphaadd: fma(AB.VEC, alpha.VEC:bc_load, C.VEC:$CL){$T}
  betaadd: fma(C.VEC:$CL, beta.VEC:bc_load, AB.VEC){$T}
  store_ab: AB.VEC:$CS
