# gemm_fma_blocklane_vindex: SVE's block-lane FMA (a lane of each 128-bit block) with the scalars broadcast by block (bc_block); C across vectors by gathers and scatters
description: SVE's block-lane FMA (a lane of each 128-bit block) with the scalars broadcast by block (bc_block); C across vectors by gathers and scatters
ukr: gemm
variants:
  m:
    K: i=m, n=1, k*=1
    T: i=m, n=1
    V: A
    S: B
  n:
    K: m=1, i=n, k*=1
    T: m=1, i=n
    V: B
    S: A
alternatives:
  BS:
  - 2
  - 4
  CL:
  - direct
  - gather
  CS:
  - direct
  - scatter
tileops:
  mm: fma[bdreg:BLOCKLANE+bdreg_blocksize=$BS]($V.VEC:direct, $S.VEC:bc_block, AB.VEC){$K}
  betascale: mul(C.VEC:$CL, beta.VEC:bc_load, C.VEC){$T}
  alphascale: fma(AB.VEC, alpha.VEC:bc_load, C.VEC){$T}
  store: C.VEC:$CS
  alphamul: mul(AB.VEC, alpha.VEC:bc_load, C.VEC){$T}
  add: add(AB.VEC, C.VEC:$CL, C.VEC){$T}
  alphaadd: fma(AB.VEC, alpha.VEC:bc_load, C.VEC:$CL){$T}
  betaadd: fma(C.VEC:$CL, beta.VEC:bc_load, AB.VEC){$T}
  store_ab: AB.VEC:$CS
