[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jukefa-ukrgen"
version = "0.2.2"
authors = [
  { name="linedot", email="linedot@linedot.org" },
]
description = "A microkernel generator"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
    "mako",
    "GitPython",
    "PyYAML",
    "jukefa-asmgen>=0.6.0"
]

[dependency-groups]
test = [
  "pytest>=8",
  "parameterized",
  "pytest-xdist"
]



[project.scripts]
blisgen = "ukrgen.clitools.blisgen:main"
ukrgen = "ukrgen.clitools.ukrgen:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/ukrgen"
]

[tool.hatch.build.targets.wheel.shared-data]
"ukrconfig" = "share/ukrgen/ukrconfig"
