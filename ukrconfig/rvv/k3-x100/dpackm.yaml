# FP64 packm, rvv on the SpacemiT K3's X100 cores (0-7) - no prologue, VLEN 256, ONE vector op a cycle
# with 2 instructions a cycle in total. Vectors along cdim - P's leading dimension a parameter, so a
# vec kernel packs the vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the
# rest, and along the panel (trans). Measured with BLIS mode, cdim 8 vectors (32 rows), panels inside
# the 64 KB L1 - bytes a cycle at n=32/64/128:
#   23.6 / 24.1 / 21.2   with 2:vl|vs,vf,sl,i and one address register a direction
#   18.4 / 18.8 / 19.7   with {X:4,Y:2} - the K1's addressing costs ~20% here as well
#   23.2-24.5 for every other issue model. Issue-bound like the FP32 file: 44 instructions a column at
# ~2 a cycle with 20 of them address adds, floor 25.6 B/cycle against 24.05 measured.
# No max-imm-offset: a packm's offsets stay within one vector
# Addressing: same story as the FP32 file, measured at cdim 8 vectors (32 rows), n=64 - the
# defaults (one register a direction, rotate) are best at 24.23 B/cyc (21.13 cycles a call), X4Y4
# + rotate costs 22% (18.94), X2Y2 + rotate 3.4%, and every count with addr-pattern phase ties the
# default to within 0.5%. NOTE a cdim of 16 vectors dispatches the REFERENCE here (the vec case
# covers m 1..8 vectors), so a sweep at cdim=64 times the reference, not this kernel.
# The kappa load is hoisted: one vlse64.v v1,(a3),zero before .ukr0_loop.
# kappa is an FP SCALAR operand (`kappa.FP:use_scalar` with `mul[bdreg:VF]`) rather than a broadcast
# vector, for one form across this tree; FP64 measures neutral (vec 24.15 -> 24.29 B/cyc at cdim 8
# vectors, trans 6.67 -> 6.66 on jsc-k3-2) while the FP32 file gains 2-6% from it.
# trans: structfuse at fields 2, X-data-regs 4 - 12.7 cycles a column at n=80 (15.14 B/cyc) against
# 16.5 (11.65) without fusion; fields 4 ties (12.8) , X-data-regs 8 is worse (14.0).
# trans covers 32 rows, not 16: the 3v FP32 panel is 24 rows and a 16-row case left it to the
# reference entirely (57.5 cyc a column on x100, 87.8 on k1, both ~2-3 B/cyc). With the range raised
# and structfuse on, cdim 24 measures 13.92 (x100) and 30.52 (k1) cycles a column at n=80.
# A masked vec case (vtail) takes the panels past whole vectors: size N packs N vectors and a masked
# last one, so cdim N*VL..(N+1)*VL goes in one pass (N=0 covers below one vector). Measured at
# inca=1 lda=1031, n=80/96, cycles a column against the unmasked dispatch:
#   k1 FP64  cdim 14  31.90 (masked) vs 44.52 (vec + overlapping tail) vs 58.79 (vec + reference)
#            cdim 6   26.13 vs 30.36 vs 43.25          cdim 3 (below VL) 18.26 with tailmask-route vl
#   a100 FP64 cdim 14 38.76 vs 50.50 (vl route)         cdim 20 63.38 vs 72.58 vs 88.71
#            cdim 30 73.48 vs 133.18 (reference)
# tailmask-route stays mask (it wins everywhere except k1's below-one-vector case); vec-tail's default
# overlap is right too - it beats the reference for the unmasked fallback by 30-45%.
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl|vs,vf,sl,i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: vec
  name: vtail
  mask: true
  m: 0..7
  params:
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl|vs,vf,sl,i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: trans
  m: 1..32
  params:
    pre-specialize-irmods: ['+structfuse']
    structfuse-fields: 2
    X-data-regs: 4
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl|vs,vf,sl,i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
