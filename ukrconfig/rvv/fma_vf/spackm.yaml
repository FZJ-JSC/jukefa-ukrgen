# FP32 packm, rvv: vectors along cdim, and along the panel (trans)
isa: rvv
family: pk
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['fmul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:p']
- kind: trans
  m: 1..16
  unroll: 2
  params:
    pack-tileop: ['fmul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
