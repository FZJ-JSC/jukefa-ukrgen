# FP64 packm, rvv: vectors along cdim - P's leading dimension a parameter, so a vec kernel packs the
# vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest, and along the panel (trans)
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  m: 1..8
  preset: packm_vf
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
- kind: trans
  m: 1..16
  preset: packm_vf
  vectorize: n
  params:
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
