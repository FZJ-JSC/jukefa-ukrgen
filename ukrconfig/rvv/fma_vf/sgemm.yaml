# FP32 gemm, rvv: vector-scalar FMA (vfmacc.vf), scalars in FP registers; C across vectors by strided loads and stores (LMUL 1)
isa: rvv
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_vf
  vectorize: n
  unroll: 4
  m: [6, 8, 12]
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
  schedule: ['RAW:data:vreg:::13', 'WAW:data:vreg:::13', 'WAR:data:vreg:::13', 'RAW:address:greg:::3']
  max-addr-regs: {A: 2, B: 2}
  addr-pattern: {A: rotate, B: rotate}
  default: 8x3
- family: vm
  preset: gemm_fma_vf
  vectorize: m
  unroll: 4
  m: [2, 3]
  n: [4, 8, 12, 14]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
  schedule: ['RAW:data:vreg:::13', 'WAW:data:vreg:::13', 'WAR:data:vreg:::13', 'RAW:address:greg:::3']
  max-addr-regs: {A: 2, B: 2}
  addr-pattern: {A: rotate, B: rotate}
