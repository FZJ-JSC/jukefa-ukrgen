# FP32 packm, rvv on the SpacemiT K1 (X60): vectors along cdim - P's leading dimension a parameter, so a
# vec kernel packs the vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest,
# and along the panel (trans). Measured with BLIS mode at cdim 8 vectors (cycles a column, bytes a cycle,
# panels inside L1 - see the addressing note below): the vec case takes the base packm's issue model and
# no buckets - 10.5-10.8 B/cycle at n=64. The trans case (cdim 16, lda 1, row layout) is store-bound at
# 1.39-1.47 B/cycle and buckets move it under 2% (none 1.45, vf:5 1.47, vf:8 1.45 at n=512), so vf:5 is
# kept as the marginally best and not as a measured win. No max-imm-offset: a packm's offsets stay
# within one vector
#
# Addressed with 4 X registers and 2 Y registers, rotated: the model gives a component that is only
# loaded or only stored ONE address register, so the default walks one 12-18 deep add chain per
# direction. Measured with --blis at cdim 64 (panel verified): 10.81 B/cycle at L1 (n=64) against
# 10.50, and 5.40/5.16 at n=256/1024 against 4.60/4.39 - the one-register plan also swung 4.21-6.77
# across runs where this one stayed 5.10-5.40. More registers is not monotonically better: {X:4,Y:4}
# and {X:2,Y:2} both came out worse than the default beyond L1.
# Addressing: the DEFAULTS (one register a direction, rotate) are what 8-run A/Bs pick, and the
# {X: 4, Y: 2} override this file used to carry measured 10.73 against 11.24 for the default at
# cdim 8 vectors, n=64. Full A/B (cycles a call, bytes a cycle, runs 8):
#   rotate X1Y1 2915.4 / 11.24   rotate X2Y4 3004.9 / 10.90
#   phase  X1Y1 3529.9 /  9.28   phase  X2Y4 3170.4 / 10.34
# A 15-combination grid had ranked phase first (11.57) - that ranking did not survive the 8-run
# A/B, which is why no max-addr-regs/addr-pattern key is set here. The trans case is flat across
# all of them (2.13-2.15). k1 keeps the bc_load kappa form: the FP-scalar form is 6% slower here
# on the vec case (10.85 against 11.57 in the same 15-combination grid).
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: trans
  m: 1..16
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
