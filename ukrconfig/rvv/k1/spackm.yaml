# FP32 packm, rvv on the SpacemiT K1 (X60): vectors along cdim - P's leading dimension a parameter, so a
# vec kernel packs the vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest,
# and along the panel (trans). Measured with BLIS mode at cdim 8 vectors (cycles a column, bytes a cycle,
# panels inside L1 - see the addressing note below): the vec case takes the base packm's issue model and
# no buckets - 10.5-10.8 B/cycle at n=64. The trans case (cdim 16, lda 1, row layout) is store-bound at
# 1.39-1.47 B/cycle and buckets move it under 2% (none 1.45, vf:5 1.47, vf:8 1.45 at n=512), so vf:5 is
# kept as the marginally best and not as a measured win. No max-imm-offset: a packm's offsets stay
# within one vector
#
# Addressed with 4 X registers and 2 Y registers, rotated: the model gives a component that is only
# loaded or only stored ONE address register, so the default walks one 12-18 deep add chain per
# direction. Measured with --blis at cdim 64 (panel verified): 10.81 B/cycle at L1 (n=64) against
# 10.50, and 5.40/5.16 at n=256/1024 against 4.60/4.39 - the one-register plan also swung 4.21-6.77
# across runs where this one stayed 5.10-5.40. More registers is not monotonically better: {X:4,Y:4}
# and {X:2,Y:2} both came out worse than the default beyond L1.
# Addressing: the DEFAULTS (one register a direction, rotate) are what 8-run A/Bs pick, and the
# {X: 4, Y: 2} override this file used to carry measured 10.73 against 11.24 for the default at
# cdim 8 vectors, n=64. Full A/B (cycles a call, bytes a cycle, runs 8):
#   rotate X1Y1 2915.4 / 11.24   rotate X2Y4 3004.9 / 10.90
#   phase  X1Y1 3529.9 /  9.28   phase  X2Y4 3170.4 / 10.34
# A 15-combination grid had ranked phase first (11.57) - that ranking did not survive the 8-run
# A/B, which is why no max-addr-regs/addr-pattern key is set here. The trans case is flat across
# all of them (2.13-2.15). k1 keeps the bc_load kappa form: the FP-scalar form is 6% slower here
# on the vec case (10.85 against 11.57 in the same 15-combination grid).
# trans: structfuse at fields 4, X-data-regs 4 (fields sweep at n=80, cycles a column: cdim 8
# f4 9.28 vs f2 11.99, 12 13.07 vs 17.32, 16 16.48 vs 20.68, 24 23.61 vs 30.38 - 4-row parts win
# everywhere on FP32; the FP64 file keeps 2, which wins at 8/12/16)
# cdim 14 is the exception: 2-row parts beat the auto 4+4+4+2 there (18.91 against 19.80 cycles a
# column), so it gets its own split; 7+7 and 8+6 are far worse (23.4-23.5). On x100 the auto 4-parts
# are the best at 14 (10.07 against 11.67 for 2-row parts), so only the K1 needs this line. - 23.26 cycles a column at n=80, cdim 12, inca 127
# (fields 4: 23.43) against 29.59 without fusion, i.e. -21% cycles and +27% bytes a cycle.
# trans covers 32 rows, not 16: the 3v FP32 panel is 24 rows and a 16-row case left it to the
# reference entirely (57.5 cyc a column on x100, 87.8 on k1, both ~2-3 B/cyc). With the range raised
# and structfuse on, cdim 24 measures 13.92 (x100) and 30.52 (k1) cycles a column at n=80.
# kappa is an FP scalar operand (`kappa.FP:use_scalar`, `mul[bdreg:VF]`) in every packm config now: one
# flw + vfmul.vf instead of a vlse broadcast + vfmul.vv, freeing a vector register (which is what
# structfuse's Y groups need). On the K1 this is neutral to slightly better at the dispatched cdims
# (n=80): vec cdim 8 10.76 -> 10.66, 16 16.73 -> 16.45, 24 22.48 -> 21.99 cycles a column; trans
# 8/14/16 12.09/18.97/20.74 -> 11.98/18.95/20.70. The earlier "K1 prefers bc_load" came from one
# 8-vector grid run on the pre-structfuse config and does not hold here.
# A masked vec case (vtail) takes the panels past whole vectors: size N packs N vectors and a masked
# last one, so cdim N*VL..(N+1)*VL goes in one pass (N=0 covers below one vector). Measured at
# inca=1 lda=1031, n=80/96, cycles a column against the unmasked dispatch:
#   k1 FP64  cdim 14  31.90 (masked) vs 44.52 (vec + overlapping tail) vs 58.79 (vec + reference)
#            cdim 6   26.13 vs 30.36 vs 43.25          cdim 3 (below VL) 18.26 with tailmask-route vl
#   a100 FP64 cdim 14 38.76 vs 50.50 (vl route)         cdim 20 63.38 vs 72.58 vs 88.71
#            cdim 30 73.48 vs 133.18 (reference)
# tailmask-route stays mask (it wins everywhere except k1's below-one-vector case); vec-tail's default
# overlap is right too - it beats the reference for the unmasked fallback by 30-45%.
# lmul by SIZE on the vec case (NOT the vtail one): RVV's wider vectors pay where the core is
# latency-bound, and must divide the case's vector count. Measured at inca=1 lda=1031, n=80/96,
# cycles a column, lmul 1 against the best wider one:
#   k1    FP64 cdim 8 (2v) 23.47 -> 22.58 (m2)    cdim 16 (4v) 36.11 -> 30.18 (m4, +16%)
#         FP32 cdim 16 (2v) 23.64 -> 22.64 (m2)   cdim 32 (4v) 48.69 -> 32.14 (m4, +34%)
#   a100  FP64 cdim 32 68.18 -> 62.18 (m2)       cdim 64 132.77 -> 102.33 (m4, +23%)
#         FP32 cdim 64 90.10 -> 76.30 (m2)       cdim 128 171.31 -> 128.93 (m4, +25%)
#   x100  HURTS - 9.71 -> 10.26, 10.02 -> 10.63, 14.69 -> 16.19, 15.57 -> 16.46 - so x100 keeps m1.
# Odd vector counts fall back to m1 by the key's own rule, so nothing is clamped away silently.
# Issue model: three load/vf slots instead of the inherited 2-kind one. trans14 (cdim 14, inca 127,
# n 80) 19.14 -> 18.69 cyc/col (+2.4%) and vec2v (cdim 16, inca 1) 24.06 -> 24.20 (-0.6%, flat), three
# alternating reps each. The K1 is in-order dual issue; of the nine models tried this was the only one
# to help FP32 (2:vl*3... with sl/2 came to 19.02, the 4-slot ones were 19.5-19.8).
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  lmul: {2: 2, 4: 4}
  m: 1..8
  preset: packm_vf
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "3:vf*8|vl|vs,vf*8|vl|vs,sl,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: vec
  name: vtail
  mask: true
  m: 0..7
  preset: packm_vf
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "3:vf*8|vl|vs,vf*8|vl|vs,sl,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: trans
  m: 1..32
  preset: packm_vf
  vectorize: n
  params:
    pre-specialize-irmods: ['+structfuse']
    structfuse-fields: 4
    structfuse-split: "14=2+2+2+2+2+2+2"
    X-data-regs: 4
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "3:vf*8|vl|vs,vf*8|vl|vs,sl,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
