# FP64 gemm, rvv on the SpacemiT K1 (X60): vector-scalar FMA (vfmacc.vf), scalars in FP registers;
# C across vectors by strided loads and stores (LMUL 1)
# Tuned on jsc-k1-1 cores 2 and 5 (vm 2x14): 32.7 cycles a k step, 6.9 FLOP/cycle.
# max-imm-offset min(ne+e, 16e-1): one k step of B's walk plus an element of slack (n+1 doubles,
# 120 B), so the bump lands between steps rather than inside one; the 16-element window's top
# (63 B FP32, 127 B FP64) is stated in the expression - it is not clamped for us - and the vn
# families take min(me+e, 16e-1)
isa: rvv
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_vf
  vectorize: n
  unroll: 2
  m: [4, 6, 8, 12, 14]
  n: 1..4
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    sched-cycle-slots: "2:vl*3|vs|vf,sl/2,addr|i"
    order: kmn
    max-imm-offset: "min(me+e, 16e-1)"
  schedule: ['RAW:data:freg:::8', 'RAW:data:vreg:::13', 'WAR:data::::8', 'RAW:address:greg:::12']
  max-addr-regs: {A: 1, B: "min(4, max(2, 10-2n))"}
  addr-pattern: {A: "blocked:mnk/R", B: rotate}
  c-storage: [row, any]
- family: vm
  preset: gemm_fma_vf
  vectorize: m
  unroll: 2
  m: 1..4
  n: [4, 6, 8, 12, 14]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    sched-cycle-slots: "2:vl*3|vs|vf,sl/2,addr|i"
    order: kmn
    max-imm-offset: "min(ne+e, 16e-1)"
  schedule: ['RAW:data:freg:::8', 'RAW:data:vreg:::13', 'WAR:data::::8', 'RAW:address:greg:::12']
  max-addr-regs: {A: "max(1, 12/m-2)", B: 2}
  c-storage: [col, any]
  addr-pattern: {A: rotate, B: "blocked:mnk/R"}
  default: 2x14
