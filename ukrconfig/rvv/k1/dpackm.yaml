# FP64 packm, rvv on the SpacemiT K1 (X60): vectors along cdim - P's leading dimension a parameter, so a
# vec kernel packs the vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest,
# and along the panel (trans). The chip's cycle-slots and immediate window are the gemm profile's; the
# distances and buckets are the base packm's own - no sweep of packm on this core yet
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl*3|vs|vf,sl/2,addr|i"
    max-imm-offset: 127
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
- kind: trans
  m: 1..16
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl*3|vs|vf,sl/2,addr|i"
    max-imm-offset: 127
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
