# FP64 packm, rvv on the SpacemiT K1 (X60): vectors along cdim - P's leading dimension a parameter, so a
# vec kernel packs the vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest,
# and along the panel (trans). Measured at cdim 8 with any-kernel mode: the vec case's fastest L1 plan is
# the gemm model without sl's rate limit, 119.8 cycles a step (4.27 B/cycle), but the base packm's model
# streams L2 at 2.55 B/cycle against 2.06 - it is the one kept, since panels come from L2/L3; the trans
# case keeps vf:5 with the base model. No max-imm-offset: a packm's offsets stay within one vector
#
# 4 X and 2 Y address registers, rotated (the default gives a single-direction component one register,
# i.e. one long add chain per direction). Measured with --blis at cdim 32 (panel verified): 10.92
# B/cycle at L1 (n=64) against 9.13, and 5.54/5.42 at n=256/1024 against 4.72/4.54.
# Addressing: X2Y4 + phase 12.19 B/cyc (X4Y2 phase 12.12, X1Y1 phase 11.81, X1Y1 rotate 10.90,
# X4Y2 rotate 10.83 - the previous setting), trans flat at 1.64-1.65 (old X4Y2 rotate 1.50).
# Addressing: defaults again (one register a direction, rotate) - 8-run A/B at cdim 8 vectors:
#   rotate X1Y1 2784.6 / 11.77   phase X2Y4 2822.9 / 11.61
#   phase  X1Y1 2866.9 / 11.43   rotate X2Y4 2918.8 / 11.23
# so the {X: 4, Y: 2} override this file used to carry is gone. trans is flat (1.64-1.65).
# k1 keeps the bc_load kappa form (the FP scalar one is slower here).
# trans: structfuse at fields 2, X-data-regs 4 (the K1 trans case measures the same win as FP32).
# trans covers 32 rows, not 16: the 3v FP32 panel is 24 rows and a 16-row case left it to the
# reference entirely (57.5 cyc a column on x100, 87.8 on k1, both ~2-3 B/cyc). With the range raised
# and structfuse on, cdim 24 measures 13.92 (x100) and 30.52 (k1) cycles a column at n=80.
# A masked vec case (vtail) takes the panels past whole vectors: size N packs N vectors and a masked
# last one, so cdim N*VL..(N+1)*VL goes in one pass (N=0 covers below one vector). Measured at
# inca=1 lda=1031, n=80/96, cycles a column against the unmasked dispatch:
#   k1 FP64  cdim 14  31.90 (masked) vs 44.52 (vec + overlapping tail) vs 58.79 (vec + reference)
#            cdim 6   26.13 vs 30.36 vs 43.25          cdim 3 (below VL) 18.26 with tailmask-route vl
#   a100 FP64 cdim 14 38.76 vs 50.50 (vl route)         cdim 20 63.38 vs 72.58 vs 88.71
#            cdim 30 73.48 vs 133.18 (reference)
# tailmask-route stays mask (it wins everywhere except k1's below-one-vector case); vec-tail's default
# overlap is right too - it beats the reference for the unmasked fallback by 30-45%.
# lmul by SIZE on the vec case (NOT the vtail one): RVV's wider vectors pay where the core is
# latency-bound, and must divide the case's vector count. Measured at inca=1 lda=1031, n=80/96,
# cycles a column, lmul 1 against the best wider one:
#   k1    FP64 cdim 8 (2v) 23.47 -> 22.58 (m2)    cdim 16 (4v) 36.11 -> 30.18 (m4, +16%)
#         FP32 cdim 16 (2v) 23.64 -> 22.64 (m2)   cdim 32 (4v) 48.69 -> 32.14 (m4, +34%)
#   a100  FP64 cdim 32 68.18 -> 62.18 (m2)       cdim 64 132.77 -> 102.33 (m4, +23%)
#         FP32 cdim 64 90.10 -> 76.30 (m2)       cdim 128 171.31 -> 128.93 (m4, +25%)
#   x100  HURTS - 9.71 -> 10.26, 10.02 -> 10.63, 14.69 -> 16.19, 15.57 -> 16.46 - so x100 keeps m1.
# Odd vector counts fall back to m1 by the key's own rule, so nothing is clamped away silently.
# Issue model: loads take three slots, no vf-sl split. trans14 28.15 -> 26.39 cyc/col (+6.3%) AND
# vec2v (cdim 8) 23.94 -> 22.89 (+4.6%), three alternating reps each - the largest packm gain found.
# Distances left at 13/3: 11-15 are flat, RAW:address 2 helps the old model (+3.6%) but is worse on
# top of this one (27.08), so the two do not compound.
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  lmul: {2: 2, 4: 4}
  m: 1..8
  preset: packm_vf
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl*3|vs|vf,sl,addr|i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: vec
  name: vtail
  mask: true
  m: 0..7
  preset: packm_vf
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl*3|vs|vf,sl,addr|i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: trans
  m: 1..32
  preset: packm_vf
  vectorize: n
  params:
    pre-specialize-irmods: ['+structfuse']
    structfuse-fields: 2
    X-data-regs: 4
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl*3|vs|vf,sl,addr|i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"
