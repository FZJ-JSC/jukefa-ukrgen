# FP32 gemm, rvv: as fma_vf with LMUL 2: 16 registers of two
isa: rvv
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_vf
  vectorize: n
  unroll: 4
  m: [4, 6, 8]
  n: 1..2
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    rvv-LMUL: '2'
  schedule: ['RAW:data:vreg:::13', 'WAW:data:vreg:::13', 'WAR:data:vreg:::13', 'RAW:address:greg:::3']
  max-addr-regs: {A: 2, B: 2}
  addr-pattern: {A: rotate, B: rotate}
  default: 6x2
  c-storage: [row, any]
- family: vm
  preset: gemm_fma_vf
  vectorize: m
  unroll: 4
  m: [1, 2]
  n: [4, 7]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
    rvv-LMUL: '2'
  schedule: ['RAW:data:vreg:::13', 'WAW:data:vreg:::13', 'WAR:data:vreg:::13', 'RAW:address:greg:::3']
  max-addr-regs: {A: 2, B: 2}
  addr-pattern: {A: rotate, B: rotate}
