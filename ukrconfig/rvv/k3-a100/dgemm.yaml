# FP64 gemm, rvv on the SpacemiT K3's A100 "AI" cores (8-15) - run with ukropt's k3_ai prologue.
# VLEN 1024, dual issue, 8 FLOP/cycle FP64; a vector FMA holds the vector pipe 4 cycles, a 1024-bit
# vector load ~2.3 (no shadow at all with 4-cycle FMAs), scalar loads ride along free. Tuned on
# jsc-k3-3 cores 9 and 11 (vm 2x14): 117.4-118.2 cycles a k step = 7.6 FLOP/cycle, 95% of peak.
# unroll 8 and sl:16 - longer buckets pay here; max-imm-offset min(ne+e, 16e-1), B's k-step walk of
# n doubles with an element of slack (120 B), the bump landing between steps
#
# blistune.py mid matrix results (1000-1350, step 70, mean aggregate, fixed NC):
#PER-MICROKERNEL RESULTS
#  MRxNR      GFLOPs  trials  threads   blocksizes
#  14x32     66.58     134  1_4_2_1   KC_D=656 KC_MAX_D=708 MR_D=14 MR_IN_MC_D=62 MR_IN_MC_MAX_D=62 NR_D=32 NR_IN_NC_D=432
#  32x14     79.94     134  1_1_8_1   KC_D=660 KC_MAX_D=684 MR_D=32 MR_IN_MC_D=8 MR_IN_MC_MAX_D=18 NR_D=14 NR_IN_NC_D=432
#   8x48     65.06     133  1_8_1_1   KC_D=708 KC_MAX_D=800 MR_D=8 MR_IN_MC_D=54 MR_IN_MC_MAX_D=70 NR_D=48 NR_IN_NC_D=432
#  48x8      75.37     133  1_1_8_1   KC_D=408 KC_MAX_D=532 MR_D=48 MR_IN_MC_D=4 MR_IN_MC_MAX_D=6 NR_D=8 NR_IN_NC_D=432
#  64x6      68.20     133  1_2_4_1   KC_D=148 KC_MAX_D=200 MR_D=64 MR_IN_MC_D=48 MR_IN_MC_MAX_D=78 NR_D=6 NR_IN_NC_D=432
#   6x64     59.78     133  1_8_1_1   KC_D=676 KC_MAX_D=780 MR_D=6 MR_IN_MC_D=16 MR_IN_MC_MAX_D=46 NR_D=64 NR_IN_NC_D=432
#  winner: 32x14 at 79.94 GFLOPs
#
#==================================================
#BEST GFLOPs: 79.94  (trial 122, 32x14)
#BEST CONFIGURATION:
#  BLIS_MR_D=32
#  BLIS_NR_D=14
#  BLIS_JC_NT=1
#  BLIS_IC_NT=1
#  BLIS_JR_NT=8
#  BLIS_IR_NT=1
#  BLIS_KC_D=660
#  BLIS_MR_IN_MC_D=8
#  BLIS_NR_IN_NC_D=432
#  BLIS_KC_MAX_D=684
#  BLIS_MR_IN_MC_MAX_D=18
#=================================================
#
#
#larger matrix blistune:
# ==================================================
# BEST GFLOPs: 95.87  
# BEST CONFIGURATION:
#  BLIS_MR_D=32
#  BLIS_NR_D=14
#  BLIS_JC_NT=1
#  BLIS_IC_NT=1
#  BLIS_JR_NT=8
#  BLIS_IR_NT=1
#  BLIS_KC_D=688
#  BLIS_MR_IN_MC_D=6
#  BLIS_NR_IN_NC_D=432
#  BLIS_KC_MAX_D=812
#  BLIS_MR_IN_MC_MAX_D=8
#=================================================

isa: rvv
blocksizes: {mr-in-mc: 6, mr-in-mc-max: 8, nr-in-nc: 432, nr-in-nc-max: 484, kc: 688, kc-max: 812}
families:
- family: vn
  preset: gemm_fma_vf
  vectorize: n
  unroll: 8
  m: [4, 6, 8, 12, 14]
  n: 1..4
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    sched-cycle-slots: "2:vl*2|vs|vf,sl/2,addr|i"
    order: kmn
    max-imm-offset: "min(me+e, 16e-1)"
  schedule: ['RAW:data:freg:::8', 'RAW:data:vreg:::13', 'WAR:data::::8', 'RAW:address:greg:::12']
  buckets: "vf:8,sl:16"
  max-addr-regs: {A: 2, B: 2}
  addr-pattern: {A: rotate, B: "blocked:mnk/R"}
  c-storage: [row, any]
- family: vm
  preset: gemm_fma_vf
  vectorize: m
  unroll: 8
  m: 1..4
  n: [4, 6, 8, 12, 14]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    sched-cycle-slots: "2:vl*2|vs|vf,sl/2,addr|i"
    order: kmn
    max-imm-offset: "min(ne+e, 16e-1)"
  schedule: ['RAW:data:freg:::8', 'RAW:data:vreg:::13', 'WAR:data::::8', 'RAW:address:greg:::12']
  buckets: "vf:8,sl:16"
  max-addr-regs: {A: 4, B: 2}
  c-storage: [col, any]
  addr-pattern: {A: rotate, B: "blocked:mnk/R"}
  default: 2x14
