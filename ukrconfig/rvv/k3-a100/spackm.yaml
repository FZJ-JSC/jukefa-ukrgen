# FP32 packm, rvv on the SpacemiT K3's A100 "AI" cores (8-15) - run with ukropt's k3_ai prologue. Vectors
# along cdim - P's leading dimension a parameter, so a vec kernel packs the vectors of any cdim up to 16 rows
# more (a split's 2*VL + 2), the reference the rest, and along the panel (trans). Measured at cdim 8 with
# any-kernel mode, cycles a step: the vec case takes the gemm profile's model with vf:8 - 110.4 (18.55
# B/cycle at L1) against 143.4 (14.3) for the base packm model, unlike the K1 where the base model wins;
# the trans case is store-bound (0.58 B/cycle, every variant within 0.5%), base model, no buckets.
# No max-imm-offset: a packm's offsets stay within one vector
# kappa is an FP scalar operand (`kappa.FP:use_scalar`, `mul[bdreg:VF]`) as in the gemm presets:
# flw f0 + vfmul.vf instead of a vlse broadcast + vfmul.vv. At the cdims that actually occur here it
# is NEUTRAL - FP32 cdim 64 (2v) 26.88 -> 26.84 B/cyc, cdim 96 (3v) 27.53 -> 27.49; FP64 cdim 32 (2v)
# 21.22 -> 21.29, cdim 48 (3v) 21.03 -> 21.16 (runs 4, AI cores via --use-prologue k3_ai --cpu 9).
# Only at 8 vectors did it gain (s 35.43 -> 37.71, d 29.00 -> 29.87), which a real dispatch never
# reaches (cdim is mr or nr, so 1-4 vectors). Kept for one form with the gemm presets; the K1 keeps
# bc_load, where the same change measured worse on the vec case.
# trans: structfuse at fields 4, X-data-regs 8 - 29.2 cycles a column at n=80 (3.29 B/cyc) against
# 32.9 (2.92) unfused. The a100 trans case still leaves rows to the reference (trans12 + reference
# at cdim 12), so the win is smaller than the x100's 2.1x.
# tblock: a block case (Y-layout [m:c, n:s], P's leading dimension) for the panels past one trans
# kernel's 16 rows. Measured on the AI cores via --use-prologue k3_ai, cdim in rows, n=96 (whole
# vector chunks), cycles a column and bytes a cycle against the reference:
#   cdim 64  140.98 / 3.63  (ref 250.66 / 2.04)      cdim 96  210.64 / 3.65  (ref 408.50 / 1.88)
# Dispatch stays trans-first: at cdim 16 the exact panel is 30% better than the block path
# (trans16 29.95 / 4.27 against tblock16 38.96 / 3.29); from 24 rows up only tblock can build.
# A masked vec case (vtail) takes the panels past whole vectors: size N packs N vectors and a masked
# last one, so cdim N*VL..(N+1)*VL goes in one pass (N=0 covers below one vector). Measured at
# inca=1 lda=1031, n=80/96, cycles a column against the unmasked dispatch:
#   k1 FP64  cdim 14  31.90 (masked) vs 44.52 (vec + overlapping tail) vs 58.79 (vec + reference)
#            cdim 6   26.13 vs 30.36 vs 43.25          cdim 3 (below VL) 18.26 with tailmask-route vl
#   a100 FP64 cdim 14 38.76 vs 50.50 (vl route)         cdim 20 63.38 vs 72.58 vs 88.71
#            cdim 30 73.48 vs 133.18 (reference)
# tailmask-route stays mask (it wins everywhere except k1's below-one-vector case); vec-tail's default
# overlap is right too - it beats the reference for the unmasked fallback by 30-45%.
# lmul by SIZE on the vec case (NOT the vtail one): RVV's wider vectors pay where the core is
# latency-bound, and must divide the case's vector count. Measured at inca=1 lda=1031, n=80/96,
# cycles a column, lmul 1 against the best wider one:
#   k1    FP64 cdim 8 (2v) 23.47 -> 22.58 (m2)    cdim 16 (4v) 36.11 -> 30.18 (m4, +16%)
#         FP32 cdim 16 (2v) 23.64 -> 22.64 (m2)   cdim 32 (4v) 48.69 -> 32.14 (m4, +34%)
#   a100  FP64 cdim 32 68.18 -> 62.18 (m2)       cdim 64 132.77 -> 102.33 (m4, +23%)
#         FP32 cdim 64 90.10 -> 76.30 (m2)       cdim 128 171.31 -> 128.93 (m4, +25%)
#   x100  HURTS - 9.71 -> 10.26, 10.02 -> 10.63, 14.69 -> 16.19, 15.57 -> 16.46 - so x100 keeps m1.
# Odd vector counts fall back to m1 by the key's own rule, so nothing is clamped away silently.
# Schedule: swept against lighter distance sets (none, RAW/WAW/WAR at 2/4/8) and every issue model
# here in the tree (2:vl|vs|vf..., 2:vl|vs,vf..., 2:vl*2|vs|vf..., 1-issue, 3-wide). Three alternating
# reps per variant on trans16 (cdim 16, inca 127, n 96): base 33.74/30.69/34.45 against 32.28/32.19/
# 33.40 for no distances (FP32), and 39.51/38.44/40.54 against 39.70/40.59/38.89 for RAW 4 (FP64) -
# i.e. within this core's +-5% run-to-run spread. The keys do change the emitted schedule, they just
# do not change the rate: packm here is memory/issue bound, not scheduling bound. Left as inherited.
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  lmul: {2: 2, 4: 4}
  m: 1..8
  params:
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl*2|vs|vf,sl/2,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:8"
- kind: vec
  name: vtail
  mask: true
  m: 0..7
  params:
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl*2|vs|vf,sl/2,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:8"
- kind: trans
  m: 1..16
  params:
    pre-specialize-irmods: ['+structfuse']
    structfuse-fields: 4
    X-data-regs: 8
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
  buckets: "vf:5"

- kind: trans
  name: tblock
  m: [16, 8, 4, 2, 1]
  params:
    pack-tileop: ['mul[bdreg:VF](X.VEC:direct, kappa.FP:use_scalar, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:s']
    X-data-regs: '4'
    pre-specialize-irmods: ['+structfuse']
    structfuse-fields: 4
