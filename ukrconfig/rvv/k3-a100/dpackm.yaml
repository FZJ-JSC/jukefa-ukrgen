# FP64 packm, rvv on the SpacemiT K3's A100 "AI" cores (8-15) - run with ukropt's k3_ai prologue. Vectors
# along cdim - P's leading dimension a parameter, so a vec kernel packs the vectors of any cdim up to 16 rows
# more (a split's 2*VL + 2), the reference the rest, and along the panel (trans). Measured at cdim 8 with
# any-kernel mode, cycles a step: the vec case takes the base packm model with no buckets - 102.4 (20.0
# B/cycle at L1) against 106.4 (19.2) for the gemm profile - and the trans case the gemm profile's model
# without buckets, 1084 (1.89 B/cycle) against 1152 (1.78); both trans cases are store-bound, which
# in-register transposes would change. No max-imm-offset: a packm's offsets stay within one vector
isa: rvv
family: pk
min-inflight: 16
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sched-cycle-slots: "2:vl|vs|vf,sl,i;vf-sl"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
- kind: trans
  m: 1..16
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:strided']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sched-cycle-slots: "2:vl*2|vs|vf,sl/2,addr|i"
  schedule: ['RAW:data::::13', 'WAW:data::::13', 'WAR:data::::13', 'RAW:address:greg:::3']
