# FP32 gemm, sve: block-lane FMA (fmla by element in each 128-bit block), scalars broadcast by block; C across vectors by gathers and scatters
isa: sve
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vm
  preset: gemm_fma_blocklane_vindex
  vectorize: m
  unroll: 1
  m: 1..3
  n: [4, 8, 12]
  params:
    A-layout: &id001 ['m:c', 'k:p']
    B-layout: &id002 ['n:c', 'k:p']
    C-layout: &id003 ['m:c', 'n:s']
  default: 2x8
- family: vn
  preset: gemm_fma_blocklane_vindex
  vectorize: n
  unroll: 1
  m: [4, 8, 12]
  n: 1..3
  params:
    A-layout: *id001
    B-layout: *id002
    C-layout: *id003
