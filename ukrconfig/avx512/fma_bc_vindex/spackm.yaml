# FP32 packm, avx512: vectors along cdim - P's leading dimension a parameter, so a vec kernel packs the
# vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest, and along the panel (trans)
isa: avx512
family: pk
min-inflight: 8
cases:
- kind: vec
  m: 1..8
  preset: packm_bc
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
- kind: gather
  m: 1..4
  preset: packm_bc
  vectorize: m
  alternatives: {XL: gather}
  params:
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:s']
- kind: trans
  m: 1..16
  preset: packm_bc
  vectorize: n
  store: scatter
  params:
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
