# FP32 gemm, avx512: FMA with a broadcast operand; C across vectors by gathers and scatters
isa: avx512
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_bc_vindex
  vectorize: n
  unroll: 4
  loop-order: knm           # vn's mirror of vm's kmn: one vector's rows walked at a time
  column-pointers: {C: 0}     # C walks: its lanes through x86's index forms
  m: [4, 6, 8, 12]
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  default: 8x3
  c-storage: [row, any]     # contiguous rows, and strided C
- family: vm
  preset: gemm_fma_bc_vindex
  vectorize: m
  unroll: 4
  c-storage: [col, any]     # contiguous columns, and strided C
  column-pointers: {C: 0}     # C walks: its lanes through x86's index forms
  m: 1..3
  n: [4, 8, 12, 14]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
