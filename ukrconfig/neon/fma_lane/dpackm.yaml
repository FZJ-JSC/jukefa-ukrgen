# FP64 packm, neon: vectors along cdim - P's leading dimension a parameter, so a vec kernel packs the
# vectors of any cdim up to 16 rows more (a split's 2*VL + 2), the reference the rest
isa: neon
family: pk
min-inflight: 8
cases:
- kind: vec
  m: 1..8
  preset: packm_bc
  vectorize: m
  params:
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
# A's or B's rows contiguous (the panel's index strided): rows loaded along
# the panel, transposed in registers (trn1/trn2), stored contiguous - as
# BLIS's armv8a packm (lda == 1); fma_bc_lanes' case
- kind: trans
  m: [2, 4, 6, 8, 12, 16]
  preset: packm_bc
  vectorize: n
  store: shuffle
  params:
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    X-data-regs: '4'
    Y-data-regs: '16'
