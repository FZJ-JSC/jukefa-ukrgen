# FP32 gemm, neon: lane FMA (fmla by element): the broadcast operand loaded as whole vectors; C across vectors by lanes
isa: neon
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vm
  preset: gemm_fma_lane
  vectorize: m
  unroll: 4
  loop-order: knm           # by instruction counts under auto (kNmn loses the 4x6 here)
  c-storage: [col, any]     # contiguous columns, and strided C
  m: 1..4
  n: [4, 6, 8]
  params:
    max-offset-registers: auto   # an offset budget: the walks' column changes in registers
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  default: 4x4
- family: vn
  preset: gemm_fma_lane
  vectorize: n
  unroll: 4
  loop-order: kMnm          # by instruction counts under auto (per A register (M), its lanes (m) innermost; C stored as in knm)
  m: [4, 6, 8]
  n: 1..3
  params:
    max-offset-registers: auto   # an offset budget: the walks' column changes in registers
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  c-storage: [row, any]     # contiguous rows, and strided C
