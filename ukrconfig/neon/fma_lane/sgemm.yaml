# FP32 gemm, neon: lane FMA (fmla by element): the broadcast operand loaded as whole vectors; C across vectors by lanes
isa: neon
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vm
  preset: gemm_fma_lane
  vectorize: m
  unroll: 4
  loop-order: knm           # fma_lane's k loop wants the vectorized dimension innermost: under kmn
                            # all of B's lane vectors are live at once, the 3x8 (24 accumulators) has none left
  c-storage: [col, any]     # contiguous columns, and strided C
  m: 1..4
  n: [4, 6, 8]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  default: 4x4
- family: vn
  preset: gemm_fma_lane
  vectorize: n
  unroll: 4
  # loop order kept kmn: under knm the k loop holds all of A's lane vectors
  # across n - the 8x3 (24 accumulators) has no vector register left for A
  m: [4, 6, 8]
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  c-storage: [row, any]     # contiguous rows, and strided C
