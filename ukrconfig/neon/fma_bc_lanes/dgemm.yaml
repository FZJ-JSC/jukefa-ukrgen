# FP64 gemm, neon: FMA with a broadcast operand; C across vectors by lane loads and stores
isa: neon
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_bc_lanes
  vectorize: n
  unroll: 4
  loop-order: knm           # vn's mirror of vm's kmn: one vector's rows walked at a time
  m: [4, 6, 8]
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  default: 8x3
  c-storage: [row, any]     # contiguous rows, and strided C
- family: vm
  preset: gemm_fma_bc_lanes
  vectorize: m
  unroll: 4
  c-storage: [col, any]     # contiguous columns, and strided C
  m: 1..4
  n: [4, 6, 8]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
