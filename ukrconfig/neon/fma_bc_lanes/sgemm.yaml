# FP32 gemm, neon: FMA with a broadcast operand; C across vectors by lane loads and stores
isa: neon
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_bc_lanes
  vectorize: n
  unroll: 4
  m: [4, 6, 8]
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
  schedule: ['RAW:data:vreg:::4']
  default: 8x3
- family: vm
  preset: gemm_fma_bc_lanes
  vectorize: m
  unroll: 4
  m: 1..4
  n: [4, 6, 8]
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
  schedule: ['RAW:data:vreg:::4']
