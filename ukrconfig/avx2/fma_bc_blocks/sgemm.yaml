# FP32 gemm, avx256: FMA with a broadcast operand; C across vectors by block insert/extract trees
isa: avx256
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_bc_blocks
  vectorize: n
  unroll: 4
  m: 2..6
  n: 1..3
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
  schedule: ['RAW:data:vreg:::4']
  default: 4x3
  c-storage: [row, col]
- family: vm
  preset: gemm_fma_bc_blocks
  vectorize: m
  unroll: 4
  m: 1..3
  n: 2..6
  params:
    A-layout: ['m:c', 'k:p']
    B-layout: ['n:c', 'k:p']
    C-layout: ['m:c', 'n:s']
  schedule: ['RAW:data:vreg:::4']
