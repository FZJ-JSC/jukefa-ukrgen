# FP32 gemm, avx256: FMA with a broadcast operand; C across vectors by block insert/extract trees
isa: avx256
blocksizes: {mr-in-mc: 16, nr-in-nc: 64, kc: 256}
families:
- family: vn
  preset: gemm_fma_bc_blocks
  vectorize: n
  unroll: 1
  m: 2..6
  n: 1..3
  params:
    A-layout: &id001 ['m:c', 'k:p']
    B-layout: &id002 ['n:c', 'k:p']
    C-layout: &id003 ['m:c', 'n:s']
  default: 4x3
- family: vm
  preset: gemm_fma_bc_blocks
  vectorize: m
  unroll: 1
  m: 1..3
  n: 2..6
  params:
    A-layout: *id001
    B-layout: *id002
    C-layout: *id003
