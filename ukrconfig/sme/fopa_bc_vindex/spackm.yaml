# FP32 packm, sme (streaming): vectors along cdim, and along the panel (trans)
isa: sme
family: pk
# Apple's SME has no FEAT_SME_FA64: no gathers or scatters in streaming mode
params:
  sme-FA64: 'off'
min-inflight: 8
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sme-F64F64: 'on'
# across the grain through ZA: A's rows scaled and moved into a tile's
# horizontal slices, its vertical slices stored as P's columns - sizes in
# tiles (VL rows each), no scatters (streaming mode has them only with FA64)
- kind: trans
  name: ztrans
  m: 1..4
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.TILE:>slice_vec_row){m=1, i=n}']
    store-tileop: ['Y.TILE:slices_col']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
# blocks of whole tiles, P's leading dimension: any cdim from a tile up - the
# rows left a one-tile kernel ending at cdim (vec-tail overlap) or the reference
- kind: trans
  name: zblock
  m: [4, 2, 1]
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.TILE:>slice_vec_row){m=1, i=n}']
    store-tileop: ['Y.TILE:slices_col']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:s']
