# FP32 packm, sme (streaming): vectors along cdim, and along the panel (trans)
isa: sme
family: pk
min-inflight: 8
cases:
- kind: vec
  m: 1..8
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){i=m, n=1}']
    store-tileop: ['Y.VEC:direct']
    X-layout: ['m:c', 'n:s']
    Y-layout: ['m:c', 'n:s']
    sme-F64F64: 'on'
- kind: trans
  m: 1..16
  params:
    pack-tileop: ['mul(X.VEC:direct, kappa.VEC:bc_load, Y.VEC){m=1, i=n}']
    store-tileop: ['Y.VEC:scatter']
    X-layout: ['n:c', 'm:s']
    Y-layout: ['m:c', 'n:p']
    sme-F64F64: 'on'
